apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: proyecto-2-maximus, labels: { app: gateway, equipo: maximus } }
spec:
  type: ClusterIP                      # acceso interno
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: gateway-nodeport, namespace: proyecto-2-maximus, labels: { app: gateway, equipo: maximus } }
spec:
  type: NodePort                       # http://192.168.56.10:30080
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 80, nodePort: 30080 }]
---
apiVersion: v1
kind: Service
metadata: { name: gateway-lb, namespace: proyecto-2-maximus, labels: { app: gateway, equipo: maximus } }
spec:
  type: LoadBalancer                   # http://192.168.56.10:8080
  selector: { app: gateway }
  ports: [{ port: 8080, targetPort: 80 }]