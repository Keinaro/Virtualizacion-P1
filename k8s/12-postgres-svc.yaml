# ============================================================
# Proyecto 2 — El Quetzal | Área 4 (Julio)
# Service interno para PostgreSQL.
# Los microservicios acceden a la base mediante db:5432.
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: proyecto-2-maximus
  labels:
    app: postgres
    equipo: maximus

spec:
  type: ClusterIP

  selector:
    app: postgres

  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432