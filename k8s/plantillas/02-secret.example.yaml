# ============================================================
# Proyecto 2 — El Quetzal | Área 3 (Jorge)
# PLANTILLA del Secret db-credentials. NO contiene credenciales:
# solo documenta qué claves espera el sistema.
#
# El Secret real se crea en la VM con:
#   ./scripts/crear-secret.sh .env
# a partir del .env (que nunca se versiona).
#
# Vive en k8s/plantillas/ y no en k8s/ a propósito: `kubectl apply -f k8s/`
# no entra a subcarpetas, así que esta plantilla nunca pisa el Secret real
# con los valores CAMBIAR.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: proyecto-2-maximus
  labels: { equipo: maximus }
type: Opaque
stringData:
  # Superusuario de Postgres (lo usa el Pod de la base y los scripts de init)
  POSTGRES_SUPERUSER: CAMBIAR
  POSTGRES_SUPERUSER_PASSWORD: CAMBIAR

  # Un usuario por microservicio, cada uno solo con acceso a su base
  CATALOGO_DB_USER: CAMBIAR
  CATALOGO_DB_PASSWORD: CAMBIAR
  INVENTARIO_DB_USER: CAMBIAR
  INVENTARIO_DB_PASSWORD: CAMBIAR
  CLIENTES_DB_USER: CAMBIAR
  CLIENTES_DB_PASSWORD: CAMBIAR
  PEDIDOS_DB_USER: CAMBIAR
  PEDIDOS_DB_PASSWORD: CAMBIAR
  REPORTES_DB_USER: CAMBIAR
  REPORTES_DB_PASSWORD: CAMBIAR
