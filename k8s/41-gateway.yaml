apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: proyecto-2-maximus
  labels: { app: gateway, equipo: maximus }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway, equipo: maximus }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d }
          readinessProbe: { httpGet: { path: /health, port: 80 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
      volumes:
        - name: conf
          configMap: { name: gateway-conf }