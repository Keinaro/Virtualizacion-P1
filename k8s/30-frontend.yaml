apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: proyecto-2-maximus
  labels:
    app: frontend
    equipo: maximus

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend
        equipo: maximus

    spec:
      containers:
        - name: frontend
          image: keinaro/frontend:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: proyecto-2-maximus
  labels:
    app: frontend
    equipo: maximus

spec:
  type: ClusterIP

  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 80
      protocol: TCP