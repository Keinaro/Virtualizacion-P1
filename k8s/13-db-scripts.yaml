apiVersion: v1
data:
  01-crear-bases.sh: |
    #!/bin/bash
    # ============================================================
    # Γö£├╝rea 4 ╬ô├ç├╢ Crea una base y un usuario por microservicio.
    # Se ejecuta automΓö£├¡ticamente al inicializar el volumen de Postgres
    # (docker-entrypoint-initdb.d). Idempotente: se puede repetir.
    # ============================================================
    set -e

    crear_base() {
      local db="$1" usuario="$2" clave="$3"

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<-EOSQL
        DO \$\$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${usuario}') THEN
            CREATE ROLE ${usuario} LOGIN PASSWORD '${clave}';
          END IF;
        END
        \$\$;
    EOSQL

      # CREATE DATABASE no corre dentro de un bloque DO; se consulta antes.
      if ! psql --username "$POSTGRES_USER" --dbname postgres -tAc \
           "SELECT 1 FROM pg_database WHERE datname = '${db}'" | grep -q 1; then
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
          -c "CREATE DATABASE ${db} OWNER ${usuario};"
      fi

      # Menor privilegio: cada usuario solo sobre su propia base.
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
        -c "GRANT ALL PRIVILEGES ON DATABASE ${db} TO ${usuario};"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "${db}" \
        -c "GRANT ALL ON SCHEMA public TO ${usuario};"
    }

    crear_base "$CATALOGO_DB"   "$CATALOGO_DB_USER"   "$CATALOGO_DB_PASSWORD"
    crear_base "$INVENTARIO_DB" "$INVENTARIO_DB_USER" "$INVENTARIO_DB_PASSWORD"
    crear_base "$CLIENTES_DB"   "$CLIENTES_DB_USER"   "$CLIENTES_DB_PASSWORD"
    crear_base "$PEDIDOS_DB"    "$PEDIDOS_DB_USER"    "$PEDIDOS_DB_PASSWORD"
    crear_base "$REPORTES_DB"   "$REPORTES_DB_USER"   "$REPORTES_DB_PASSWORD"

    echo "Bases y usuarios por microservicio creados."
  02-aplicar-esquemas-y-seeds.sh: |-
    #!/bin/bash
    set -e

    echo "Aplicando esquemas y datos iniciales..."

    aplicar_sql() {
      local db="$1"
      local usuario="$2"
      local archivo="$3"

      echo "Aplicando $archivo en $db..."

      psql \
        -v ON_ERROR_STOP=1 \
        --username "$usuario" \
        --dbname "$db" \
        -f "$archivo"
    }

    # -------------------------
    # Esquemas
    # -------------------------

    aplicar_sql "$CATALOGO_DB" \
                "$CATALOGO_DB_USER" \
                "/opt/elquetzal/schemas/catalogo.sql"

    aplicar_sql "$INVENTARIO_DB" \
                "$INVENTARIO_DB_USER" \
                "/opt/elquetzal/schemas/inventario.sql"

    aplicar_sql "$CLIENTES_DB" \
                "$CLIENTES_DB_USER" \
                "/opt/elquetzal/schemas/clientes.sql"

    aplicar_sql "$PEDIDOS_DB" \
                "$PEDIDOS_DB_USER" \
                "/opt/elquetzal/schemas/pedidos.sql"

    aplicar_sql "$REPORTES_DB" \
                "$REPORTES_DB_USER" \
                "/opt/elquetzal/schemas/reportes.sql"

    # -------------------------
    # Seeds
    # -------------------------

    aplicar_sql "$CATALOGO_DB" \
                "$CATALOGO_DB_USER" \
                "/opt/elquetzal/seeds/catalogo.sql"

    aplicar_sql "$INVENTARIO_DB" \
                "$INVENTARIO_DB_USER" \
                "/opt/elquetzal/seeds/inventario.sql"

    aplicar_sql "$CLIENTES_DB" \
                "$CLIENTES_DB_USER" \
                "/opt/elquetzal/seeds/clientes.sql"

    echo "Esquemas y seeds aplicados correctamente."
kind: ConfigMap
metadata:
  labels:
    app: postgres
    equipo: maximus
  name: db-init
  namespace: proyecto-2-maximus
---
apiVersion: v1
data:
  catalogo.sql: "CREATE TABLE IF NOT EXISTS categorias (\r\n    id          SERIAL
    PRIMARY KEY,\r\n    nombre      VARCHAR(80) NOT NULL UNIQUE,\r\n    descripcion
    TEXT\r\n);\r\n\r\nCREATE TABLE IF NOT EXISTS productos (\r\n    id           SERIAL
    PRIMARY KEY,\r\n    sku          VARCHAR(40) NOT NULL UNIQUE,\r\n    nombre       VARCHAR(160)
    NOT NULL,\r\n    categoria_id INTEGER REFERENCES categorias(id),\r\n    precio
    \      NUMERIC(12,2) NOT NULL CHECK (precio >= 0),\r\n    creado_en    TIMESTAMPTZ
    NOT NULL DEFAULT now()\r\n);\r\n"
  clientes.sql: "CREATE TABLE IF NOT EXISTS clientes (\r\n    id        SERIAL PRIMARY
    KEY,\r\n    carne     VARCHAR(20) NOT NULL UNIQUE,\r\n    nombre    VARCHAR(160)
    NOT NULL,\r\n    correo    VARCHAR(160),\r\n    creado_en TIMESTAMPTZ NOT NULL
    DEFAULT now()\r\n);"
  inventario.sql: "CREATE TABLE IF NOT EXISTS existencias (\r\n    id             SERIAL
    PRIMARY KEY,\r\n    sku            VARCHAR(40) NOT NULL UNIQUE,\r\n    nombre
    \        VARCHAR(160) NOT NULL,\r\n    categoria      VARCHAR(80),\r\n    precio
    \        NUMERIC(12,2) NOT NULL CHECK (precio >= 0),\r\n    stock          INTEGER
    NOT NULL CHECK (stock >= 0),\r\n    stock_minimo   INTEGER NOT NULL DEFAULT 5
    CHECK (stock_minimo >= 0),\r\n    actualizado_en TIMESTAMPTZ NOT NULL DEFAULT
    now()\r\n);"
  pedidos.sql: "CREATE TABLE IF NOT EXISTS pedidos (\r\n    id        SERIAL PRIMARY
    KEY,\r\n    carne     VARCHAR(20) NOT NULL,\r\n    estado    VARCHAR(20) NOT NULL
    DEFAULT 'confirmado'\r\n              CHECK (estado IN ('confirmado', 'rechazado',
    'anulado')),\r\n    total     NUMERIC(12,2) NOT NULL DEFAULT 0 CHECK (total >=
    0),\r\n    creado_en TIMESTAMPTZ NOT NULL DEFAULT now()\r\n);\r\n\r\nCREATE TABLE
    IF NOT EXISTS pedido_lineas (\r\n    id              SERIAL PRIMARY KEY,\r\n    pedido_id
    \      INTEGER NOT NULL\r\n                    REFERENCES pedidos(id) ON DELETE
    CASCADE,\r\n    sku             VARCHAR(40) NOT NULL,\r\n    cantidad        INTEGER
    NOT NULL CHECK (cantidad > 0),\r\n    precio_unitario NUMERIC(12,2) NOT NULL CHECK
    (precio_unitario >= 0)\r\n);\r\n\r\nCREATE INDEX IF NOT EXISTS idx_pedidos_creado_en\r\n
    \   ON pedidos(creado_en);\r\n\r\nCREATE INDEX IF NOT EXISTS idx_pedido_lineas_pedido\r\n
    \   ON pedido_lineas(pedido_id);"
  reportes.sql: "CREATE TABLE IF NOT EXISTS reportes_generados (\r\n    id          SERIAL
    PRIMARY KEY,\r\n    tipo        VARCHAR(60) NOT NULL,\r\n    parametros  JSONB
    NOT NULL DEFAULT '{}'::jsonb,\r\n    resultado   JSONB,\r\n    generado_en TIMESTAMPTZ
    NOT NULL DEFAULT now()\r\n);"
