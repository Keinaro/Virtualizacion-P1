# ============================================================
# Área 2 — Gateway nginx
# ============================================================

server {
    listen 80;
    server_name _;

    # --- Headers estándar de proxy reutilizados en cada ruta ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- Frontend Vue (build estático) ----------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Rutas hacia los microservicios (Área 5) ----------
    location /api/catalogo/ {
        proxy_pass http://catalogo:5000/;
    }

    location /api/inventario/ {
        proxy_pass http://inventario:5000/;
    }

    location /api/clientes/ {
        proxy_pass http://clientes:5000/;
    }

    location /api/pedidos/ {
        proxy_pass http://pedidos:5000/;
    }

    location /api/reportes/ {
        proxy_pass http://reportes:5000/;
    }

    # ---------- Salud del gateway ----------
    location = /health {
        access_log off;
        return 200 "gateway ok\n";
        add_header Content-Type text/plain;
    }
}
