# =========================================================
# Variables de la VM — El Quetzal / Área 1: Infraestructura
# =========================================================
# Completa GROUP_NAME y CARNE antes de correr los scripts de host/.
# Estas variables las leen host/01-create-vm.ps1 y sirven de referencia
# para el resto del equipo.

# Nombre de grupo asignado por el docente (para el hostname srv-elquetzal-maximus)
GROUP_NAME=Maximus

# Tu carné (integrante responsable de Infraestructura) — para seeds/evidencias
CARNE=1200022

# Nombre de la VM en VirtualBox
VM_NAME=srv-elquetzal-maximus

# Hostname dentro del guest Ubuntu (debe verse en las capturas de evidencia)
GUEST_HOSTNAME=srv-elquetzal-maximus

# --- Sizing (ver docs/00-sizing.md para la justificación) ---
RAM_MB=4096
CPU_COUNT=2
DISK_GB=25

# --- Instalación ---
ISO_PATH=C:\Users\danie\Downloads\ubuntu-22.04.5-live-server-amd64.iso
VM_BASE_FOLDER=C:\Users\danie\VirtualBox VMs

# --- Red host <-> VM (ver docs/03-red-host-vm.md) ---
# Puertos que se exponen en el host apuntando a la VM (adaptador NAT)
SSH_HOST_PORT=2222
HTTP_HOST_PORT=8090
