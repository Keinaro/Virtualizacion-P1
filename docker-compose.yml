# ============================================================
# Proyecto 1 — El Quetzal | Área 3 (Orquestación)
# Contrato de nombres de servicios y puertos internos.
# Solo el gateway publica puerto hacia el host.
# ============================================================

services:

  # ---------- Área 4: Datos ----------
  db:
    image: postgres:16-alpine
    container_name: elquetzal-db
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      # Consumidas por db/init/01-crear-bases.sh
      CATALOGO_DB: ${CATALOGO_DB}
      CATALOGO_DB_USER: ${CATALOGO_DB_USER}
      CATALOGO_DB_PASSWORD: ${CATALOGO_DB_PASSWORD}
      INVENTARIO_DB: ${INVENTARIO_DB}
      INVENTARIO_DB_USER: ${INVENTARIO_DB_USER}
      INVENTARIO_DB_PASSWORD: ${INVENTARIO_DB_PASSWORD}
      CLIENTES_DB: ${CLIENTES_DB}
      CLIENTES_DB_USER: ${CLIENTES_DB_USER}
      CLIENTES_DB_PASSWORD: ${CLIENTES_DB_PASSWORD}
      PEDIDOS_DB: ${PEDIDOS_DB}
      PEDIDOS_DB_USER: ${PEDIDOS_DB_USER}
      PEDIDOS_DB_PASSWORD: ${PEDIDOS_DB_PASSWORD}
      REPORTES_DB: ${REPORTES_DB}
      REPORTES_DB_USER: ${REPORTES_DB_USER}
      REPORTES_DB_PASSWORD: ${REPORTES_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - interna
    restart: unless-stopped

  # ---------- Área 5: Microservicios Flask ----------
  catalogo:
    build: ./servicios/catalogo
    image: ${DOCKERHUB_NAMESPACE}/catalogo:1.0
    container_name: elquetzal-catalogo
    environment:
      DATABASE_URL: postgresql://${CATALOGO_DB_USER}:${CATALOGO_DB_PASSWORD}@db:5432/${CATALOGO_DB}
      FLASK_ENV: ${FLASK_ENV}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Sonda /health con la stdlib de Python: la imagen slim no trae curl/wget.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - interna
    restart: unless-stopped

  inventario:
    build: ./servicios/inventario
    image: ${DOCKERHUB_NAMESPACE}/inventario:1.0
    container_name: elquetzal-inventario
    environment:
      DATABASE_URL: postgresql://${INVENTARIO_DB_USER}:${INVENTARIO_DB_PASSWORD}@db:5432/${INVENTARIO_DB}
      FLASK_ENV: ${FLASK_ENV}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - interna
    restart: unless-stopped

  clientes:
    build: ./servicios/clientes
    image: ${DOCKERHUB_NAMESPACE}/clientes:1.0
    container_name: elquetzal-clientes
    environment:
      DATABASE_URL: postgresql://${CLIENTES_DB_USER}:${CLIENTES_DB_PASSWORD}@db:5432/${CLIENTES_DB}
      FLASK_ENV: ${FLASK_ENV}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - interna
    restart: unless-stopped

  pedidos:
    build: ./servicios/pedidos
    image: ${DOCKERHUB_NAMESPACE}/pedidos:1.0
    container_name: elquetzal-pedidos
    environment:
      DATABASE_URL: postgresql://${PEDIDOS_DB_USER}:${PEDIDOS_DB_PASSWORD}@db:5432/${PEDIDOS_DB}
      INVENTARIO_URL: http://inventario:5000
      CLIENTES_URL: http://clientes:5000
      FLASK_ENV: ${FLASK_ENV}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - interna
    restart: unless-stopped

  reportes:
    build: ./servicios/reportes
    image: ${DOCKERHUB_NAMESPACE}/reportes:1.0
    container_name: elquetzal-reportes
    environment:
      DATABASE_URL: postgresql://${REPORTES_DB_USER}:${REPORTES_DB_PASSWORD}@db:5432/${REPORTES_DB}
      INVENTARIO_URL: http://inventario:5000
      PEDIDOS_URL: http://pedidos:5000
      FLASK_ENV: ${FLASK_ENV}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - interna
    restart: unless-stopped

  # ---------- Área 2 + 6: Gateway sirviendo el build de Vue ----------
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: ${DOCKERHUB_NAMESPACE}/gateway:1.0
    container_name: elquetzal-gateway
    ports:
      - "${GATEWAY_PORT}:80"
    depends_on:
      # Espera a que cada microservicio responda /health, no solo a que arranque
      # el contenedor: evita 502 del proxy en los primeros segundos de la demo.
      catalogo:
        condition: service_healthy
      inventario:
        condition: service_healthy
      clientes:
        condition: service_healthy
      pedidos:
        condition: service_healthy
      reportes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - interna
    restart: unless-stopped

networks:
  interna:
    name: elquetzal_interna
    driver: bridge

volumes:
  pgdata:
    name: elquetzal_pgdata
