# ============================================================
# Proyecto 1 — El Quetzal | Área 3 (Orquestación)
# Contrato de nombres de servicios y puertos internos.
# Solo el gateway publica puerto hacia el host (GATEWAY_PORT: 80 en la VM).
# ============================================================

services:

  # ---------- Área 4: Datos ----------
  db:
    image: postgres:16-alpine
    container_name: elquetzal-db
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      # Consumidas por db/init/01-crear-bases.sh
      CATALOGO_DB: ${CATALOGO_DB}
      CATALOGO_DB_USER: ${CATALOGO_DB_USER}
      CATALOGO_DB_PASSWORD: ${CATALOGO_DB_PASSWORD}
      INVENTARIO_DB: ${INVENTARIO_DB}
      INVENTARIO_DB_USER: ${INVENTARIO_DB_USER}
      INVENTARIO_DB_PASSWORD: ${INVENTARIO_DB_PASSWORD}
      CLIENTES_DB: ${CLIENTES_DB}
      CLIENTES_DB_USER: ${CLIENTES_DB_USER}
      CLIENTES_DB_PASSWORD: ${CLIENTES_DB_PASSWORD}
      PEDIDOS_DB: ${PEDIDOS_DB}
      PEDIDOS_DB_USER: ${PEDIDOS_DB_USER}
      PEDIDOS_DB_PASSWORD: ${PEDIDOS_DB_PASSWORD}
      REPORTES_DB: ${REPORTES_DB}
      REPORTES_DB_USER: ${REPORTES_DB_USER}
      REPORTES_DB_PASSWORD: ${REPORTES_DB_PASSWORD}
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./db/init:/docker-entrypoint-initdb.d:ro
    - ./db/schemas:/opt/elquetzal/schemas:ro
    - ./db/seeds:/opt/elquetzal/seeds:ro
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante los scripts de db/init/ Postgres corre
      # un servidor temporal solo por socket, y sin -h se reportaria 'healthy'
      # antes de terminar de crear las bases y los microservicios arrancarian antes.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_SUPERUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - interna
    restart: unless-stopped

  # ---------- Área 5: Microservicios Flask ----------
  catalogo:
    build: ./backend/catalogo
    image: ${DOCKERHUB_NAMESPACE}/catalogo:1.0
    container_name: elquetzal-catalogo
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${CATALOGO_DB_USER}
      DB_PASSWORD: ${CATALOGO_DB_PASSWORD}
      DB_NAME: ${CATALOGO_DB}
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Sonda /health con la stdlib de Python: la imagen slim no trae curl/wget.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - interna
    restart: unless-stopped

  inventario:
    build: ./backend/inventario
    image: ${DOCKERHUB_NAMESPACE}/inventario:1.0
    container_name: elquetzal-inventario
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${INVENTARIO_DB_USER}
      DB_PASSWORD: ${INVENTARIO_DB_PASSWORD}
      DB_NAME: ${INVENTARIO_DB}
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - interna
    restart: unless-stopped

  clientes:
    build: ./backend/clientes
    image: ${DOCKERHUB_NAMESPACE}/clientes:1.0
    container_name: elquetzal-clientes
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${CLIENTES_DB_USER}
      DB_PASSWORD: ${CLIENTES_DB_PASSWORD}
      DB_NAME: ${CLIENTES_DB}
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - interna
    restart: unless-stopped

  pedidos:
    build: ./backend/pedidos
    image: ${DOCKERHUB_NAMESPACE}/pedidos:1.0
    container_name: elquetzal-pedidos
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${PEDIDOS_DB_USER}
      DB_PASSWORD: ${PEDIDOS_DB_PASSWORD}
      DB_NAME: ${PEDIDOS_DB}
      PORT: 5000
      INVENTARIO_URL: http://inventario:5000
      CLIENTES_URL: http://clientes:5000
    depends_on:
      db:
        condition: service_healthy
      # Pedidos llama a inventario (reserva de stock) y a clientes (valida carné)
      inventario:
        condition: service_healthy
      clientes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - interna
    restart: unless-stopped

  reportes:
    build: ./backend/reportes
    image: ${DOCKERHUB_NAMESPACE}/reportes:1.0
    container_name: elquetzal-reportes
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${REPORTES_DB_USER}
      DB_PASSWORD: ${REPORTES_DB_PASSWORD}
      DB_NAME: ${REPORTES_DB}
      PORT: 5000
      INVENTARIO_URL: http://inventario:5000
      PEDIDOS_URL: http://pedidos:5000
    depends_on:
      db:
        condition: service_healthy
      # Reportes agrega datos de inventario y pedidos
      inventario:
        condition: service_healthy
      pedidos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - interna
    restart: unless-stopped

  # ---------- Área 2 + 6: Gateway sirviendo el build de Vue ----------
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: ${DOCKERHUB_NAMESPACE}/gateway:1.0
    container_name: elquetzal-gateway
    ports:
      - "${GATEWAY_PORT}:80"
    depends_on:
      # Espera a que cada microservicio responda /health, no solo a que arranque
      # el contenedor: evita 502 del proxy en los primeros segundos de la demo.
      catalogo:
        condition: service_healthy
      inventario:
        condition: service_healthy
      clientes:
        condition: service_healthy
      pedidos:
        condition: service_healthy
      reportes:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 explicito: nginx hace 'listen 80' (solo IPv4) y dentro del
      # contenedor 'localhost' resuelve primero a ::1 -> connection refused.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - interna
    restart: unless-stopped

networks:
  interna:
    name: elquetzal_interna
    driver: bridge

volumes:
  pgdata:
    name: elquetzal_pgdata
